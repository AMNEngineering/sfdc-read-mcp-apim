name: '1.0$(rev:.r)'

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - policies/**
      - .ado/pipelines/deploy.yml

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: Terraform/amn-az-tf-common-pipelines
      ref: refs/tags/v2.1.8

variables:
  ServiceConnection_Lower: 'ADO-AMNEngineering-CloudOps-lower-AMN-IPS-ServiceConnection'
  ServiceConnection_Upper: 'ADO-AMNEngineering-CloudOps-Upper-AMN-IPS-AutomaticSC'
  StateStorageAccountSubscriptionId: '43c5a646-c00c-4c59-a332-df854c5dd08c'
  StateStorageAccountResourceGroup: 'co-wus2-tfstate-rg-p01'
  StateStorageAccount_Lower: 'amncowus2tfstatesad01'
  StateStorageAccount_Upper: 'amncowus2tfstatesap01'
  VerticalName: 'sfdc-read'
  PoolName: ''  # Use Azure Pipelines (Microsoft-hosted)
  system.debug: 'true'

stages:
  - template: templates/build_template.yml@templates
    parameters:
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Lower)

  # -----------------------------------------------------------------------------------------------------------------
  # Dev environment Plan stage
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/plan_template.yml@templates
    parameters:
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Lower)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: dev
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Lower)
      resourceFile: environments/dev.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Dev environment Apply stage
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/apply_template.yml@templates
    parameters:
      customCondition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Lower)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: dev
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Lower)
      resourceFile: environments/dev.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Dev Test Stage - Custom (PowerShell test harness)
  # -----------------------------------------------------------------------------------------------------------------
  - stage: dev_test
    displayName: "Test_Dev"
    dependsOn: dev_apply
    condition: succeeded()
    pool:
      ${{ if ne(variables['PoolName'], '') }}:
        name: $(PoolName)
      ${{ else }}:
        vmImage: 'windows-latest'
    jobs:
      - job: RunTests
        displayName: 'Run Test Harness'
        steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: 'Test APIM Deployment'
            inputs:
              azureSubscription: $(ServiceConnection_Lower)
              scriptType: 'inlineScript'
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true
              script: |
                Write-Host "✅ Dev environment deployed successfully"
                Write-Host "TODO: Run test harness once implemented"
                # Future: .\test-harness\Invoke-SfdcReadTest.ps1 -Environment dev -TestSuite all

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Plan stage
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/plan_template.yml@templates
    parameters:
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Lower)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: int
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Lower)
      resourceFile: environments/int.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Apply stage
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/apply_template.yml@templates
    parameters:
      customCondition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Lower)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: int
      previousEnvironment: dev
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Lower)
      resourceFile: environments/int.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Prod environment Plan stage (requires CAB approval before creating this)
  # -----------------------------------------------------------------------------------------------------------------
  # NOTE: Production stages commented out until CAB approval obtained
  # - template: templates/plan_template.yml@templates
  #   parameters:
  #     PoolName: $(PoolName)
  #     serviceConnection: $(ServiceConnection_Upper)
  #     subscription_id: $(StateStorageAccountSubscriptionId)
  #     vertical: $(VerticalName)
  #     environment: prod
  #     backendResourceGroup: $(StateStorageAccountResourceGroup)
  #     backendStorageAccount: $(StateStorageAccount_Upper)
  #     resourceFile: environments/prod.tfvars

