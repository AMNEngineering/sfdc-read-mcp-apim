  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Plan stage
  # NOTE: Int is in PROD subscription, uses Upper service connection
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/plan_template.yml@templates
    parameters:
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Upper)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: int
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Upper)
      resourceFile: environments/int.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Apply stage
  # -----------------------------------------------------------------------------------------------------------------
  - template: templates/apply_template.yml@templates
    parameters:
      customCondition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"
      PoolName: $(PoolName)
      serviceConnection: $(ServiceConnection_Upper)
      subscription_id: $(StateStorageAccountSubscriptionId)
      vertical: $(VerticalName)
      environment: int
      previousEnvironment: dev
      backendResourceGroup: $(StateStorageAccountResourceGroup)
      backendStorageAccount: $(StateStorageAccount_Upper)
      resourceFile: environments/int.tfvars

