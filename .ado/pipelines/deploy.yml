name: '1.0$(rev:.r)'

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: git
      name: Terraform/amn-az-tf-common-pipelines
      ref: refs/tags/v2.1.8

variables:
  ServiceConnection_Lower: 'ADO-AMNEngineering-CloudOps-lower-AMN-IPS-ServiceConnection'
  ServiceConnection_Upper: 'ADO-AMNEngineering-CloudOps-Upper-AMN-IPS-AutomaticSC'
  StateStorageAccountSubscriptionId: '43c5a646-c00c-4c59-a332-df854c5dd08c'
  StateStorageAccountResourceGroup: 'co-wus2-tfstate-rg-p01'
  StateStorageAccount_Lower: 'amncowus2tfstatesad01'
  StateStorageAccount_Upper: 'amncowus2tfstatesap01'
  VerticalName: 'sfdc-read'
  PoolName: 'Azure Pipelines'  # Microsoft-hosted agents
  system.debug: 'true'

stages:
  # -----------------------------------------------------------------------------------------------------------------
  # Minimal Build stage (plan_template depends on it)
  # -----------------------------------------------------------------------------------------------------------------
  - stage: Build
    displayName: "Build"
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Checkout
        displayName: 'Checkout Code'
        steps:
          - checkout: self
            clean: true

  # -----------------------------------------------------------------------------------------------------------------
  # Dev environment Plan stage - CUSTOM (bypasses exit code 2 issue in common template)
  # -----------------------------------------------------------------------------------------------------------------
  - stage: dev_plan
    displayName: "Terraform_Plan_dev"
    dependsOn: Build
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Plan_Configuration
        displayName: "Plan Configuration"
        steps:
          - checkout: self
            clean: true

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            displayName: "Terraform Install"
            inputs:
              terraformVersion: '1.12.0'

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              azureSubscription: '$(ServiceConnection_Lower)'
              inlineScript: |
                echo "Exporting ADO service principal credentials..."
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId

                cd infrastructure
                terraform init \
                  -backend-config="storage_account_name=$(StateStorageAccount_Lower)" \
                  -backend-config="container_name=$(VerticalName)" \
                  -backend-config="key=$(VerticalName)-dev.tfstate" \
                  -backend-config="resource_group_name=$(StateStorageAccountResourceGroup)" \
                  -backend-config="subscription_id=$(StateStorageAccountSubscriptionId)"

          - task: AzureCLI@2
            displayName: "Terraform Plan"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              azureSubscription: '$(ServiceConnection_Lower)'
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId

                cd infrastructure
                terraform plan -input=false -var-file="environments/dev.tfvars" -out=$(Build.ArtifactStagingDirectory)/dev_plan

                # Capture exit code
                PLAN_EXIT=$?
                echo "Terraform plan exit code: $PLAN_EXIT"

                # Exit codes: 0=no changes, 1=error, 2=changes detected
                # We treat 0 and 2 as success
                if [ $PLAN_EXIT -eq 0 ] || [ $PLAN_EXIT -eq 2 ]; then
                  echo "##[section]Plan succeeded (exit code $PLAN_EXIT)"
                  exit 0
                else
                  echo "##[error]Plan failed with exit code $PLAN_EXIT"
                  exit $PLAN_EXIT
                fi

          - task: PublishPipelineArtifact@1
            displayName: "Publish Terraform Plan"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/dev_plan'
              artifact: 'TF_Plan_Artifact_dev'

  # -----------------------------------------------------------------------------------------------------------------
  # Dev environment Apply stage - CUSTOM
  # -----------------------------------------------------------------------------------------------------------------
  - stage: dev_apply
    displayName: "Terraform_Apply_dev"
    dependsOn: dev_plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - deployment: Apply_Configuration
        displayName: "Apply Configuration"
        environment: 'sfdc-read-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: DownloadPipelineArtifact@2
                  displayName: "Download Terraform Plan"
                  inputs:
                    artifact: 'TF_Plan_Artifact_dev'
                    path: '$(Build.ArtifactStagingDirectory)'

                - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
                  displayName: "Terraform Install"
                  inputs:
                    terraformVersion: '1.12.0'

                - task: AzureCLI@2
                  displayName: "Terraform Init"
                  inputs:
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    azureSubscription: '$(ServiceConnection_Lower)'
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId

                      cd infrastructure
                      terraform init \
                        -backend-config="storage_account_name=$(StateStorageAccount_Lower)" \
                        -backend-config="container_name=$(VerticalName)" \
                        -backend-config="key=$(VerticalName)-dev.tfstate" \
                        -backend-config="resource_group_name=$(StateStorageAccountResourceGroup)" \
                        -backend-config="subscription_id=$(StateStorageAccountSubscriptionId)"

                - task: AzureCLI@2
                  displayName: "Terraform Apply"
                  inputs:
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    azureSubscription: '$(ServiceConnection_Lower)'
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId

                      cd infrastructure
                      terraform apply -input=false $(Build.ArtifactStagingDirectory)/dev_plan

  # -----------------------------------------------------------------------------------------------------------------
  # Dev environment Verify stage
  # -----------------------------------------------------------------------------------------------------------------
  - stage: dev_verify
    displayName: "Verify_dev"
    dependsOn: dev_apply
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Verify_Deployment
        displayName: "Verify Dev Deployment"
        steps:
          - task: AzureCLI@2
            displayName: "Verify APIM API"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              azureSubscription: '$(ServiceConnection_Lower)'
              inlineScript: |
                APIM="amn-wus2-hub-apim-d02"
                RG="amn-wus2-hub-rg-d01"

                echo "Verifying API exists on $APIM..."
                API=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/e764d23e-759d-4cd4-8b5f-27e4c703f6a8/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/apis/api-sfdc-read-dev?api-version=2022-08-01" \
                  --query "{name:name, path:properties.path}" -o json 2>&1)

                if [ $? -ne 0 ]; then
                  echo "##[error]API not found on $APIM"
                  echo "$API"
                  exit 1
                fi

                echo "API: $API"

                echo "Verifying policy is deployed..."
                POLICY=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/e764d23e-759d-4cd4-8b5f-27e4c703f6a8/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/apis/api-sfdc-read-dev/policies/policy?api-version=2022-08-01&format=rawxml" \
                  --query "properties.value" -o tsv 2>&1 || true)

                if echo "$POLICY" | grep -q "validate-azure-ad-token"; then
                  echo "##[section]Dev policy verified — JWT validation present"
                else
                  echo "##[error]Policy missing or invalid"
                  exit 1
                fi

                echo "Verifying named values..."
                NV_COUNT=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/e764d23e-759d-4cd4-8b5f-27e4c703f6a8/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/namedValues?api-version=2022-08-01" \
                  --query "length(value[?starts_with(properties.displayName, 'SFDC')])" -o tsv 2>&1)

                echo "SFDC named values found: $NV_COUNT"
                if [ "$NV_COUNT" -ge 3 ]; then
                  echo "##[section]Dev verify PASSED — API, policy, and named values confirmed"
                else
                  echo "##[error]Expected at least 3 SFDC named values, found $NV_COUNT"
                  exit 1
                fi

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Plan stage - CUSTOM (bypasses exit code 2 issue in common template)
  # NOTE: Int is in PROD subscription, uses Upper service connection
  # -----------------------------------------------------------------------------------------------------------------
  - stage: int_plan
    displayName: "Terraform_Plan_int"
    dependsOn: dev_verify
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Plan_Configuration
        displayName: "Plan Configuration"
        steps:
          - checkout: self
            clean: true

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            displayName: "Terraform Install"
            inputs:
              terraformVersion: '1.12.0'

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              azureSubscription: '$(ServiceConnection_Upper)'
              inlineScript: |
                echo "Exporting ADO service principal credentials..."
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId

                cd infrastructure
                terraform init \
                  -backend-config="storage_account_name=$(StateStorageAccount_Upper)" \
                  -backend-config="container_name=$(VerticalName)" \
                  -backend-config="key=$(VerticalName)-int.tfstate" \
                  -backend-config="resource_group_name=$(StateStorageAccountResourceGroup)" \
                  -backend-config="subscription_id=$(StateStorageAccountSubscriptionId)"

          - task: AzureCLI@2
            displayName: "Terraform Plan"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              azureSubscription: '$(ServiceConnection_Upper)'
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId

                cd infrastructure
                terraform plan -input=false -var-file="environments/int.tfvars" -out=$(Build.ArtifactStagingDirectory)/int_plan

                # Capture exit code
                PLAN_EXIT=$?
                echo "Terraform plan exit code: $PLAN_EXIT"

                # Exit codes: 0=no changes, 1=error, 2=changes detected
                # We treat 0 and 2 as success
                if [ $PLAN_EXIT -eq 0 ] || [ $PLAN_EXIT -eq 2 ]; then
                  echo "##[section]Plan succeeded (exit code $PLAN_EXIT)"
                  exit 0
                else
                  echo "##[error]Plan failed with exit code $PLAN_EXIT"
                  exit $PLAN_EXIT
                fi

          - task: PublishPipelineArtifact@1
            displayName: "Publish Terraform Plan"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/int_plan'
              artifact: 'TF_Plan_Artifact_int'

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Apply stage - CUSTOM
  # -----------------------------------------------------------------------------------------------------------------
  - stage: int_apply
    displayName: "Terraform_Apply_int"
    dependsOn: int_plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Int Apply Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Manual approval before int apply"
            inputs:
              notifyUsers: 'bart.elia@amnhealthcare.com'
              instructions: |
                Review the Terraform plan artifact "TF_Plan_Artifact_int" before approving.
                Resume to apply changes to int APIM (prod subscription), Reject to cancel.
              onTimeout: 'reject'

      - deployment: Apply_Configuration
        displayName: "Apply Configuration"
        dependsOn: WaitForApproval
        environment: 'sfdc-read-int'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: DownloadPipelineArtifact@2
                  displayName: "Download Terraform Plan"
                  inputs:
                    artifact: 'TF_Plan_Artifact_int'
                    path: '$(Build.ArtifactStagingDirectory)'

                - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
                  displayName: "Terraform Install"
                  inputs:
                    terraformVersion: '1.12.0'

                - task: AzureCLI@2
                  displayName: "Terraform Init"
                  inputs:
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    azureSubscription: '$(ServiceConnection_Upper)'
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId

                      cd infrastructure
                      terraform init \
                        -backend-config="storage_account_name=$(StateStorageAccount_Upper)" \
                        -backend-config="container_name=$(VerticalName)" \
                        -backend-config="key=$(VerticalName)-int.tfstate" \
                        -backend-config="resource_group_name=$(StateStorageAccountResourceGroup)" \
                        -backend-config="subscription_id=$(StateStorageAccountSubscriptionId)"

                - task: AzureCLI@2
                  displayName: "Terraform Apply"
                  inputs:
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    azureSubscription: '$(ServiceConnection_Upper)'
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId

                      cd infrastructure
                      terraform apply -input=false $(Build.ArtifactStagingDirectory)/int_plan

  # -----------------------------------------------------------------------------------------------------------------
  # Int environment Verify stage
  # -----------------------------------------------------------------------------------------------------------------
  - stage: int_verify
    displayName: "Verify_int"
    dependsOn: int_apply
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Verify_Deployment
        displayName: "Verify Int Deployment"
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: "Verify APIM API"
            inputs:
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              azureSubscription: '$(ServiceConnection_Upper)'
              inlineScript: |
                APIM="amn-wus2-hub-apim-i02"
                RG="amn-wus2-hub-rg-i01"
                SUB="06ab2c80-382c-478f-bcd5-5e1afe984092"

                az account set --subscription "$SUB"

                echo "Verifying API exists on $APIM..."
                API=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/apis/api-sfdc-read-int?api-version=2022-08-01" \
                  --query "{name:name, path:properties.path}" -o json 2>&1)

                if [ $? -ne 0 ]; then
                  echo "##[error]API not found on $APIM"
                  echo "$API"
                  exit 1
                fi

                echo "API: $API"

                echo "Verifying policy is deployed..."
                POLICY=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/apis/api-sfdc-read-int/policies/policy?api-version=2022-08-01&format=rawxml" \
                  --query "properties.value" -o tsv 2>&1 || true)

                if echo "$POLICY" | grep -q "validate-azure-ad-token"; then
                  echo "##[section]Int policy verified — JWT validation present"
                else
                  echo "##[error]Policy missing or invalid"
                  exit 1
                fi

                if echo "$POLICY" | grep -q "send-request"; then
                  echo "##[section]Int policy verified — Salesforce OAuth exchange present"
                else
                  echo "##[error]Policy missing Salesforce OAuth exchange"
                  exit 1
                fi

                echo "Verifying named values (including Key Vault status)..."
                NV_STATUS=$(az rest --method GET \
                  --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/namedValues?api-version=2022-08-01" \
                  --query "value[?starts_with(properties.displayName, 'SFDC')].{name:properties.displayName, secret:properties.secret, kvStatus:properties.keyVault.lastStatus.code}" -o json 2>&1)

                echo "Named values: $NV_STATUS"

                NV_COUNT=$(echo "$NV_STATUS" | grep -c "SFDC" || true)
                if [ "$NV_COUNT" -ge 5 ]; then
                  echo "##[section]Int verify PASSED — API, policy, named values, and KV references confirmed"
                else
                  echo "##[error]Expected at least 5 SFDC named values, found $NV_COUNT"
                  exit 1
                fi

          # End-to-end smoke against the deployed gateway.
          # Uses the ADO Upper SPN's client_credentials with scope=<app-id>/.default
          # so the token's aud is bare-GUID — the format PA produces in self-OAuth
          # and that PR #19 taught the policy to accept. Catches audience-acceptance
          # regressions automatically; the ARM checks above only verify the policy
          # XML contains certain strings, not that the policy still accepts the
          # token shapes downstream consumers (PA / Copilot Studio) send.
          - task: AzureCLI@2
            displayName: "Smoke test (bare-GUID audience)"
            inputs:
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              azureSubscription: '$(ServiceConnection_Upper)'
              inlineScript: |
                $env:ARM_CLIENT_ID     = $env:servicePrincipalId
                $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
                $env:ARM_TENANT_ID     = $env:tenantId
                ./test-harness/Invoke-ApimSmokeTest.ps1 -TokenMode AppOnly

  # -----------------------------------------------------------------------------------------------------------------
  # Prod environment Plan stage (requires CAB approval before creating this)
  # -----------------------------------------------------------------------------------------------------------------
  # NOTE: Production stages commented out until CAB approval obtained
  # - template: templates/plan_template.yml@templates
  #   parameters:
  #     PoolName: $(PoolName)
  #     serviceConnection: $(ServiceConnection_Upper)
  #     subscription_id: $(StateStorageAccountSubscriptionId)
  #     vertical: $(VerticalName)
  #     environment: prod
  #     backendResourceGroup: $(StateStorageAccountResourceGroup)
  #     backendStorageAccount: $(StateStorageAccount_Upper)
  #     resourceFile: environments/prod.tfvars

  # -----------------------------------------------------------------------------------------------------------------
  # Prod environment Apply stage (requires CAB approval before creating this)
  # -----------------------------------------------------------------------------------------------------------------
